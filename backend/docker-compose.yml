services:
  inngest:
    build:
      context: .
      dockerfile: Dockerfile.inngest
    image: backend-inngest:slim
    container_name: inngest-dev
    ports:
      - "8288:8288"
      - "8289:8289"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  minio:
    image: pgsty/silo:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
     image: redis:7-alpine
     container_name: redis-yourworkspace
     ports:
       - "6379:6379"
     volumes:
       - redis_data:/data
     command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
     restart: unless-stopped

volumes:
  redis_data:
    driver: local
  minio_data:
  
